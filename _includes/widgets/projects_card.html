<div class="row mt-3">
    <div class="col">
        <div class="card border-0 shadow-sm bg-white">
            <div class="card-body p-4">
                <div class="d-flex align-items-baseline mb-3">
                    <h5 class="mb-0"><i class="fas fa-flask"></i> Selected Projects</h5>
                    <span class="ml-auto small text-muted">Research and systems</span>
                </div>
                <div class="row">
                    {% for project in site.data.profile.projects %}
                    <div class="col-md-6 mb-3 mb-md-0">
                        <article class="project-tile h-100">
                            <img src="{{ project.image | relative_url }}" alt="{{ project.title }}" class="project-image">
                            <div class="p-3">
                                <div class="d-flex align-items-baseline">
                                    <h6 class="mb-1">{{ project.title }}</h6>
                                    <span class="ml-auto small text-muted">{{ project.subtitle }}</span>
                                </div>
                                <p class="small text-muted mb-2">{{ project.text }}</p>
                                {% if project.link %}
                                <a class="small" target="_blank" href="{{ project.link }}">Project page <i class="fas fa-arrow-up-right-from-square"></i></a>
                                {% endif %}
                            </div>
                        </article>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</div>
