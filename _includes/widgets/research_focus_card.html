<div class="row mt-3">
    <div class="col">
        <div class="card border-0 shadow-sm bg-white">
            <div class="card-body p-4">
                <h5 class="mb-3"><i class="fas fa-compass"></i> Research Focus</h5>
                <div class="row">
                    {% for item in site.data.profile.research_focus %}
                    <div class="col-md-4 mb-3 mb-md-0">
                        <div class="focus-item h-100">
                            <div class="focus-icon"><i class="{{ item.icon }}"></i></div>
                            <h6>{{ item.title }}</h6>
                            <p class="small text-muted mb-0">{{ item.text }}</p>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</div>
