short_bio: >-
  <p>
    I am a Robotics undergraduate at Southern University of Science and Technology (SUSTech), Shenzhen, China
    (B.Eng., expected June 2027). My work sits at the intersection of contact-rich manipulation, tactile
    intelligence, embodied learning, and mechanism-driven robot design.
  </p>
  <p>
    I currently work on embodied AI at Whole-Body Intelligence (WBI), designing an AMASS-to-robot motion
    retargeting pipeline and deploying reinforcement-learning policies with BeyondMimic and MJLab.
  </p>
  <p>
    I am a co-author of an IROS 2025 paper on SPARK Hand and a Global Champion (1st Place) in ASME SMRDC 2025.
    I aim to build robust embodied systems where principled mechanics and data-driven control reinforce each other.
  </p>

