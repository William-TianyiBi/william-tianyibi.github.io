short_bio: >-
  <p>
    I am a Robotics undergraduate at Southern University of Science and Technology (SUSTech),
    Shenzhen, China (B.Eng., expected June 2027). My research interests include embodied AI,
    robot manipulation, and learning-based control.
  </p>
  <p>
    My research experience includes UMI gripper teleoperation and demonstration collection for
    robot policy training, visuo-tactile manipulation in simulation, and mechanism-driven hand
    design through SPARK Hand. At Ola Dimensions, I work on GMR and RL pretraining for System 0
    motion control and contribute to model evaluation.
  </p>
  <p>
    I co-authored an IROS 2025 paper on SPARK Hand and won first place in the undergraduate
    track of the 2025 ASME Student Mechanism and Robot Design Competition.
  </p>

